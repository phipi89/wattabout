[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattabout"
version = "0.1.1"
description = "Compare everyday activities through their environmental impacts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ipython>=9.16.1",
    "pint>=0.24,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wattabout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
